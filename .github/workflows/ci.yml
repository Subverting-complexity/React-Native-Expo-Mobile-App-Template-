name: CI

# Run the quality gate on every push and pull request that targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels an in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only needs to read the repository.
permissions:
  contents: read

jobs:
  # The same strict gate developers run with `npm run check`, under PowerShell 7
  # on Linux, for fast feedback. The step list lives in QualityGate.ps1 only.
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict quality gate (PowerShell 7)
        run: pwsh -NoProfile -File tools/quality/ps/QualityGate.ps1 -Mode ci

  # The same gate again through `npm run check`, which uses Windows PowerShell
  # 5.1. This guards the .ps1 scripts against PowerShell 5.1 regressions, which
  # the Linux job cannot catch.
  windows-toolchain:
    name: Windows toolchain gate
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict quality gate (Windows PowerShell 5.1)
        run: npm run check
